name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # windows-latest ships VS 2026, which node-gyp (better-sqlite3 build) does not detect yet.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Repo tests need better-sqlite3, which postinstall rebuilt for Electron: run them inside it.
      - name: Database tests
        shell: bash
        run: GL_DB_TESTS=1 ELECTRON_RUN_AS_NODE=1 npx electron node_modules/vitest/vitest.mjs run src/main/db

      - name: Build
        run: npx electron-vite build

      # Tags publish the installer, portable exe and latest.yml (auto-update feed) to the public
      # releases repo. RELEASES_TOKEN: fine-grained PAT with Contents read/write on that repo only.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Package only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --x64 --publish never

      - name: Keep installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-windows
          path: |
            dist/*.exe
            dist/latest.yml
