appId: dev.andre.gamelauncher
productName: Game Launcher
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # Window/taskbar icon at runtime (the exe icon comes from win.icon).
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
portable:
  # Single .exe that runs without installing; settings live in AppData like the installed app.
  artifactName: ${productName} Portable ${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
