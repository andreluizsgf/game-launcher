appId: dev.andre.gamelauncher
productName: Game Launcher
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # Window/taskbar icon at runtime (the exe icon comes from win.icon).
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
portable:
  # Single .exe that runs without installing; settings live in AppData like the installed app.
  artifactName: Game-Launcher-Portable-${version}.${ext}
nsis:
  # No spaces: the name in latest.yml must match the uploaded asset.
  artifactName: Game-Launcher-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Auto-update: installers are published to a public releases-only repo (the code repo is private).
# electron-updater reads latest.yml from there.
publish:
  provider: github
  owner: andreluizsgf
  repo: game-launcher-releases
  releaseType: release
